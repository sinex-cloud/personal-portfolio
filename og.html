<!doctype html>
<!-- Source of og.png (the LinkedIn/social preview). Regenerate with:
     chromium --headless --hide-scrollbars --window-size=1200,630 --virtual-time-budget=3000 --screenshot=og.png og.html -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&amp;family=Geist:wght@500&amp;family=Geist+Mono:wght@400;500&amp;display=block">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { background: #ECE9E1; color: #0E0E10; font-family: "Geist", sans-serif; position: relative; }
  .wrap { position: relative; padding: 64px 80px; height: 100%; box-sizing: border-box; }
  .top { display: flex; align-items: center; justify-content: space-between; font: 700 30px/1 "Bricolage Grotesque", sans-serif; letter-spacing: -.02em; }
  .top i { display: inline-block; width: 18px; height: 18px; margin-right: 14px; border-radius: 5px; background: #FF4A1C; transform: rotate(45deg); }
  .top span { font: 500 20px/1 "Geist Mono", monospace; color: #5C5951; }
  h1 { margin: 44px 0 0; font: 800 96px/1 "Bricolage Grotesque", sans-serif; letter-spacing: -.04em; }
  h1 b { color: #FF4A1C; font-weight: 800; }
  .route { position: absolute; left: 80px; right: 80px; bottom: 128px; display: grid; grid-template-columns: repeat(5, 1fr); }
  .route::before { content: ""; position: absolute; left: 10%; right: 10%; top: 13px; height: 3px; background: repeating-linear-gradient(90deg, #0E0E10 0 10px, transparent 10px 18px); }
  .route div { position: relative; display: grid; justify-items: center; gap: 6px; padding-top: 44px; font: 700 24px/1 "Bricolage Grotesque", sans-serif; }
  .route div::before { content: ""; position: absolute; top: 0; width: 28px; height: 28px; border-radius: 50%; background: #FF4A1C; }
  .route small { font: 400 17px/1 "Geist Mono", monospace; color: #5C5951; }
  .avail { position: absolute; left: 80px; bottom: 44px; font: 400 21px/1 "Geist Mono", monospace; color: #0E0E10; }
  .avail::before { content: ""; display: inline-block; width: 12px; height: 12px; margin-right: 14px; border-radius: 50%; background: #1FB36B; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="top"><div><i></i>Ahmed Brini</div><span>Software engineering student, Cloud Security &amp; Infrastructure Automation</span></div>
    <h1>I build the road from<br><b>git push</b> to live servers.</h1>
    <div class="route"><div>push<small>git push to main</small></div><div>test<small>16.7 s</small></div><div>build<small>30.9 s</small></div><div>deploy<small>36.5 s</small></div><div>live<small>2 of 2 servers</small></div></div>
    <p class="avail">Open to a capstone internship (PFE) from January 2027</p>
  </div>
</body>
</html>
